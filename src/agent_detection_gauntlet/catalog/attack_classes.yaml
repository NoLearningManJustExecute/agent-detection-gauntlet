# Which techniques each attack class exercises, as the source lab's threat model files them
# (agent-risk-framework docs/threat_model.md, at the commit below, the file's last edit). Its
# framework IDs per threat date from that repository's commit fb6fdf6, before any rule here existed.
# It ties techniques to classes for per-technique counts and the "no successful attacks" reason.
# It cannot make a technique covered: that comes from the rules' pooled results only.
#
# IDs are in this repository's catalog vocabulary. The source lab numbers OWASP LLM differently
# (its LLM03 is Excessive Agency and its LLM04 is Supply Chain; the catalog here has LLM06 and
# LLM03), so those two are matched by title. Phase 7 verifies every ID against the primary source.
# not_in_catalog holds source IDs, as written there, that no rule here may reference.
