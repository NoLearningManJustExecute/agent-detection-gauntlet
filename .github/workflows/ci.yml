name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest with coverage (fails under 90 percent)
        run: pytest --cov --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Schema drift check
        run: gauntlet export-schemas --check
      - name: Validate traces
        run: gauntlet validate-traces datasets/fixtures/traces
      - name: Validate rules
        run: gauntlet validate-rules rules --fixtures datasets/fixtures/traces
      - name: Scan and score, run 1
        run: |
          gauntlet scan --rules rules --traces datasets/fixtures/traces --out out/detections.jsonl
          gauntlet metrics --rules rules --traces datasets/fixtures/traces \
            --detections out/detections.jsonl --labels datasets/fixtures/labels.jsonl \
            --split heldout --out out/metrics.json
          mkdir -p out/run1
          cp out/detections.jsonl out/metrics.json out/run1/
      - name: Scan and score, run 2
        run: |
          gauntlet scan --rules rules --traces datasets/fixtures/traces --out out/detections.jsonl
          gauntlet metrics --rules rules --traces datasets/fixtures/traces \
            --detections out/detections.jsonl --labels datasets/fixtures/labels.jsonl \
            --split heldout --out out/metrics.json
      - name: Determinism check
        run: |
          cmp out/run1/detections.jsonl out/detections.jsonl
          cmp out/run1/metrics.json out/metrics.json
          test "$(wc -l < out/detections.jsonl)" -ge 1
          echo "detections and metrics are byte-identical across runs"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --skip-editable
