name: CI

# No path filters: the leak guard must run on every change, documentation included.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Pull request runs replace each other. Every push to main gets its own group, so no pushed
# range is ever cancelled or skipped while queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The gate runs the guard from the default branch (pull requests) or the previous main
      # (pushes), so a change cannot weaken the guard that checks it. It falls back to this
      # change's copy only when that commit has no guard with range support (the first install,
      # or the upgrade that adds it).
      - name: Select the guard
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="origin/$DEFAULT_BRANCH"; fi
          guard="tools/leak_guard.py"
          if [ -n "$base" ] && git cat-file -e "$base:tools/leak_guard.py" 2>/dev/null; then
            git show "$base:tools/leak_guard.py" > "$RUNNER_TEMP/leak_guard.py"
            if python "$RUNNER_TEMP/leak_guard.py" --help | grep -q -- "--range"; then
              guard="$RUNNER_TEMP/leak_guard.py"
            fi
          fi
          if [ "$guard" = "tools/leak_guard.py" ]; then
            echo "leak guard source: this change (the base has no guard with range support)"
          else
            echo "leak guard source: $base"
          fi
          echo "LEAK_GUARD=$guard" >> "$GITHUB_ENV"
      # Blocking gate: only the commits this change adds. The full scan runs on a schedule.
      - name: Scan new commits
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python "$LEAK_GUARD" --root . --range "$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python "$LEAK_GUARD" --root . --history
          else
            python "$LEAK_GUARD" --root . --range "$PUSH_BEFORE..$PUSH_AFTER"
          fi
      - name: Flag baseline changes for review
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$PR_BASE" "$PR_HEAD" -- .leakguard-baseline .leakguard-allow .github .githooks tools/leak_guard.py; then
            echo "leak guard baseline and allowlist unchanged"
          else
            echo "::warning::leak guard configuration, workflows or hooks changed: review every change; baseline and allowlist changes apply only after they reach the base branch"
          fi
      - name: Scan pull request text
        if: github.event_name == 'pull_request'
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$LEAK_GUARD" --root . --pr

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: mypy strict
        run: mypy --strict src tests tools

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest with coverage (fails under 90 percent)
        run: pytest --cov --cov-report=term-missing

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Schema drift check
        run: gauntlet export-schemas --check
      - name: Validate traces
        run: gauntlet validate-traces datasets/fixtures/traces
      - name: Validate rules (fixtures are synthetic traces and the dev split)
        run: gauntlet validate-rules rules
      - name: Fitted baselines match the dev benign traces
        run: gauntlet fit-baselines --check
      - name: Detection catalog matches the rules
        run: gauntlet rules-doc --check
      - name: Scan and score, run 1
        run: |
          gauntlet scan --rules rules --traces datasets/fixtures/traces --out out/detections.jsonl
          gauntlet metrics --rules rules --traces datasets/fixtures/traces \
            --detections out/detections.jsonl --labels datasets/fixtures/labels.jsonl \
            --split heldout --out out/metrics.json
          mkdir -p out/run1
          cp out/detections.jsonl out/metrics.json out/run1/
      - name: Scan and score, run 2
        run: |
          gauntlet scan --rules rules --traces datasets/fixtures/traces --out out/detections.jsonl
          gauntlet metrics --rules rules --traces datasets/fixtures/traces \
            --detections out/detections.jsonl --labels datasets/fixtures/labels.jsonl \
            --split heldout --out out/metrics.json
      - name: Determinism check
        run: |
          cmp out/run1/detections.jsonl out/detections.jsonl
          cmp out/run1/metrics.json out/metrics.json
          test "$(wc -l < out/detections.jsonl)" -ge 1
          echo "detections and metrics are byte-identical across runs"
      - name: Leak guard on generated outputs
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: python tools/leak_guard.py --text out/detections.jsonl --text out/metrics.json

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate corpus traces (every split and K)
        run: |
          for dir in datasets/corpus/dev/k* datasets/corpus/heldout/k*; do
            gauntlet validate-traces "$dir"
          done
      # Freeze: the manifest must equal the one in the freeze commit. On a pull request that is
      # the base branch's copy; on main it is the commit that first added the manifest. A new
      # corpus (no manifest on the base yet) is checked against its own hashes only.
      - name: Split manifest unchanged since the freeze
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          manifest=datasets/corpus/SPLIT_MANIFEST.json
          frozen="$RUNNER_TEMP/frozen-manifest.json"
          if [ "$EVENT" = "pull_request" ]; then
            # fetch-depth 0 already checked out every branch; no fetch (no credentials here).
            base="origin/$BASE_REF"
            if git cat-file -e "$base:$manifest" 2>/dev/null; then
              git show "$base:$manifest" > "$frozen"
            fi
          else
            first=$(git log --diff-filter=A --format=%H -- "$manifest" | tail -n 1)
            if [ -n "$first" ]; then git show "$first:$manifest" > "$frozen"; fi
          fi
          if [ -f "$frozen" ]; then
            gauntlet corpus verify --frozen-manifest "$frozen"
          else
            echo "no frozen manifest on the base yet; checking hashes only"
            gauntlet corpus verify
          fi
      - name: Dataset card matches the corpus
        run: gauntlet corpus card --check

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      # The registration must equal the commit that first added it, and results must name its
      # hashes. Before a registration exists this only checks that no results exist either.
      - name: Pre-registration frozen, results reference its rule hashes
        run: |
          prereg=docs/preregistration.json
          if [ -f "$prereg" ]; then
            first=$(git log --diff-filter=A --format=%H -- "$prereg" | tail -n 1)
            git show "$first:$prereg" > "$RUNNER_TEMP/frozen-prereg.json"
            gauntlet validation verify --frozen-prereg "$RUNNER_TEMP/frozen-prereg.json"
          else
            gauntlet validation verify
          fi
      # The only CI step that reads the held-out split, and only once a golden file exists. Its
      # log row lands on this runner and is discarded. The step prints no trace content.
      - name: Re-score and compare with the golden file
        env:
          GAUNTLET_SCORING_HELDOUT: "1"
        run: |
          if [ -f results/baseline/metrics.json ]; then
            gauntlet validation score --check
          else
            echo "no golden file yet; nothing scored"
          fi
      - name: Results report matches the JSON
        run: |
          if [ -f results/baseline/metrics.json ]; then
            gauntlet validation report --check
          else
            echo "no golden file yet; nothing to check"
          fi
      - name: Leak guard on results
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          for file in docs/preregistration.json docs/preregistration.md \
            results/baseline/metrics.json docs/results-baseline.md docs/heldout-log.md; do
            if [ -f "$file" ]; then python tools/leak_guard.py --text "$file"; fi
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --skip-editable
